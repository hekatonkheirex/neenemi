appId: com.datasystems.suite
productName: Data Systems Suite
artifactName: Data-Systems-Suite-${version}-${arch}.${ext}
asar: true
# ensure-native.mjs prepara y valida el binding para el runtime de Electron.
# Builder no debe descargarlo ni recompilarlo durante el empaquetado.
npmRebuild: false
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - electron/**
  - package.json
asarUnpack:
  - node_modules/better-sqlite3/**
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Data Systems Suite
linux:
  target:
    - target: dir
      arch:
        - x64
  category: Office
