appId: com.datasystems.dcss
productName: DCSS Suite
artifactName: DCSS-Suite-${version}-${arch}.${ext}
asar: true
# ensure-native.mjs prepara y valida el binding para el runtime de Electron.
# Builder no debe descargarlo ni recompilarlo durante el empaquetado.
npmRebuild: false
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - electron/**
  - package.json
extraResources:
  - from: build/icon.png
    to: icon.png
  # Clave de IA incluida solo si existe embedded-ai.json (ignorado por git); nunca va dentro del asar ni del renderer.
  - from: .
    to: .
    filter:
      - embedded-ai.json
asarUnpack:
  - node_modules/better-sqlite3/**
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DCSS Suite
linux:
  icon: build/icon.png
  target:
    - target: dir
      arch:
        - x64
  category: Office
